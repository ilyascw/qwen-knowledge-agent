[project]
name = "qwen-knowledge-agent"
version = "0.1.0"
description = "Single-user Telegram knowledge agent with read-only Atlassian access and private memory"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "aiogram>=3.22,<4",
    "mcp>=1.28,<2",
    "mcp-atlassian==0.23.0",
    "pydantic>=2.9,<3",
    "pydantic-settings>=2.5,<3",
]

[project.scripts]
knowledge-agent = "knowledge_agent.main:run"
knowledge-agent-mcp = "knowledge_agent.mcp_server:main"
knowledge-agent-doctor = "knowledge_agent.doctor:main"

[dependency-groups]
dev = [
    "mypy>=1.11",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/knowledge_agent"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src", "tests"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false
disallow_untyped_calls = false

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
